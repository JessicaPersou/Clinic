services:
  postgres:
    image: 'postgres:15'
    container_name: clinic-postgres
    environment:
      - 'POSTGRES_DB=clinic_db'
      - 'POSTGRES_USER=clinic_user'
      - 'POSTGRES_PASSWORD=clinic_pass'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic_user -d clinic_db"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data: