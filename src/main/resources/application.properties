spring.application.name=clinic
server.port=8000

## PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/clinic
spring.datasource.username=seu_usuario
spring.datasource.password=sua_senha
spring.datasource.driver-class-name=org.postgresql.Driver
# Configurações do JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
# Configurações do Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=true
# Especificar conexão Flyway manualmente
spring.flyway.url=jdbc:postgresql://localhost:5432/clinic
spring.flyway.user=seu_usuario
spring.flyway.password=sua_senha


git branch -M develop
git remote add origin https://github.com/JessicaPersou/Clinic.git
git push -u origin develop